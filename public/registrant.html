<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVORA - Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>REVORA Registration</h1>
  <a href="admin.html" style="color:white;font-size:0.85rem;">Admin Portal &rarr;</a>
</header>
<main>
  <div id="message"></div>

  <form id="registerForm" class="card">
    <h2>Account Type</h2>
    <div class="row">
      <div>
        <label><input type="radio" name="accountType" value="Individual" checked> Individual</label>
      </div>
      <div>
        <label><input type="radio" name="accountType" value="Entity"> Entity</label>
      </div>
    </div>

    <h2>Personal Information</h2>
    <div class="row">
      <div><label>First Name</label><input name="firstName" required></div>
      <div><label>Middle Name</label><input name="middleName"></div>
    </div>
    <div class="row">
      <div><label>Last Name</label><input name="lastName" required></div>
      <div><label>Suffix</label><input name="suffix" placeholder="Jr., Sr., III"></div>
    </div>
    <div class="row">
      <div><label>Email</label><input type="email" name="email" required></div>
      <div><label>Phone Number</label><input name="phoneNumber" placeholder="09XXXXXXXXX" pattern="09[0-9]{9}" required></div>
    </div>
    <label>Birth Date</label>
    <input type="date" name="birthDate" required>

    <label>Category</label>
    <select name="categoryId" id="categoryId" required></select>

    <label>Role</label>
    <select name="roleId" id="roleId" required></select>

    <h2>Government ID</h2>
    <div class="row">
      <div>
        <label>ID Type</label>
        <select name="govtType" id="govtType" required></select>
      </div>
      <div><label>ID Number</label><input name="govtNo" id="govtNo" required></div>
    </div>
    <p class="muted" id="govtHint"></p>

    <h2>Account Credentials</h2>
    <div class="row">
      <div><label>Username</label><input name="username" maxlength="10" required></div>
      <div><label>Password</label><input type="password" name="password" required></div>
    </div>

    <h2>Home Address</h2>
    <label>Detailed Address (Street, Bldg, Unit No.)</label>
    <textarea name="detailedHome" rows="2" required></textarea>
    <div class="row">
      <div><label>City / Municipality</label><input name="city" required></div>
      <div><label>Province</label><input name="province" required></div>
    </div>
    <label>Postal Code</label>
    <input name="postalCode" maxlength="4" pattern="[0-9]{4}" required>

    <div id="entitySection" class="hidden">
      <h2>Entity Information</h2>
      <div class="row">
        <div><label>Entity Name</label><input name="entityName" id="entityName"></div>
        <div><label>TIN (11 characters)</label><input name="tin" id="tin" maxlength="11"></div>
      </div>
      <label>Sector</label>
      <select name="sectorId" id="sectorId"></select>

      <h2>Branch Information</h2>
      <label>Branch Code</label>
      <input name="branchCode" id="branchCode" maxlength="5" placeholder="00000">
      <label>Branch Detailed Address</label>
      <textarea name="branchDetailedAddress" id="branchDetailedAddress" rows="2"></textarea>
      <div class="row">
        <div><label>Branch City</label><input name="branchCity" id="branchCity"></div>
        <div><label>Branch Postal Code</label><input name="branchPostalCode" id="branchPostalCode" maxlength="4" pattern="[0-9]{4}"></div>
      </div>
    </div>

    <div style="margin-top:20px;">
      <button type="submit" class="btn-primary">Submit Registration</button>
    </div>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
